name: Tests

on:
  push:
  pull_request:

jobs:
  test:
    name: PHP 8.4
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: shivammathur/setup-php@v2
        with:
          php-version: '8.4'
          coverage: pcov
          extensions: pdo_sqlite

      - run: composer update --prefer-dist --no-interaction --no-progress --prefer-stable
      - run: composer verify
